<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      .glow-pulse {
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .pipeline-flow {
        stroke-dasharray: 8 8;
        animation: flowDash 20s linear infinite;
      }
      .float-pill-1 {
        animation: floatPill1 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatPill2 7s ease-in-out infinite alternate 1s;
      }
      .float-pill-3 {
        animation: floatPill3 8s ease-in-out infinite alternate 2s;
      }
      .pulse-dot {
        animation: dotGlow 3s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.95); }
        50% { opacity: 0.65; transform: scale(1.05); }
        100% { opacity: 0.35; transform: scale(0.95); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes floatPill1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
      @keyframes floatPill3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes dotGlow {
        0% { r: 3; opacity: 0.4; }
        100% { r: 6; opacity: 1; }
      }
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.025em;
      }
      .text-sub {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .text-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <g class="glow-pulse" style="transform-origin: 300px 200px;">
    <ellipse cx="280" cy="180" rx="220" ry="140" fill="#6366F1" opacity="0.3" filter="url(#glow-blur)" />
  </g>
  <g class="glow-pulse" style="transform-origin: 900px 220px; animation-delay: -4s;">
    <ellipse cx="920" cy="220" rx="260" ry="160" fill="#EC4899" opacity="0.22" filter="url(#glow-blur)" />
    <ellipse cx="780" cy="140" rx="180" ry="100" fill="#06B6D4" opacity="0.25" filter="url(#glow-blur)" />
  </g>

  <!-- Dynamic Animated Documentation Pipeline Flow in Background (Lower opacity, will not interfere with foreground) -->
  <g opacity="0.45">
    <path class="pipeline-flow" d="M 80 80 Q 300 20 600 80 T 1120 70" fill="none" stroke="#6366F1" stroke-width="2.5" />
    <path class="pipeline-flow" d="M 80 340 Q 400 390 750 330 T 1120 350" fill="none" stroke="#06B6D4" stroke-width="2" style="animation-direction: reverse;" />
  </g>

  <!-- Animated Tech Tags / Floating Badges (Placed intentionally along top/bottom margins so center text is untouched) -->
  <g class="float-pill-1" filter="url(#badge-shadow)">
    <!-- Top-left pill: Docs-as-Code -->
    <rect x="70" y="35" width="145" height="34" rx="17" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
    <circle cx="87" cy="52" r="4.5" fill="#10B981" />
    <text x="100" y="58" fill="#E2E8F0" font-size="13" class="text-code">Docs-as-Code</text>

    <!-- Top-right pill: Multi-Format -->
    <rect x="975" y="35" width="155" height="34" rx="17" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" />
    <circle cx="992" cy="52" r="4.5" fill="#F59E0B" />
    <text x="1005" y="58" fill="#E2E8F0" font-size="13" class="text-code">HTML • PDF • EPUB</text>
  </g>

  <g class="float-pill-2" filter="url(#badge-shadow)">
    <!-- Bottom-left pill: Markdown & MDX -->
    <rect x="80" y="345" width="165" height="34" rx="17" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <circle cx="97" cy="362" r="4.5" fill="#06B6D4" />
    <text x="110" y="368" fill="#E2E8F0" font-size="13" class="text-code">Markdown + MDX</text>

    <!-- Bottom-center pill: CCMS & Enterprise -->
    <rect x="510" y="348" width="180" height="34" rx="17" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
    <circle cx="528" cy="365" r="4.5" fill="#EC4899" />
    <text x="541" y="371" fill="#E2E8F0" font-size="13" class="text-code">CCMS &amp; Enterprise</text>

    <!-- Bottom-right pill: AI & LLMs.txt -->
    <rect x="980" y="345" width="145" height="34" rx="17" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <circle cx="997" cy="362" r="4.5" fill="#10B981" />
    <text x="1010" y="368" fill="#E2E8F0" font-size="13" class="text-code">LLMs.txt &amp; MCP</text>
  </g>

  <!-- FOREGROUND: Protected Card Container for Ultra-Crisp, Unobstructed Text -->
  <g filter="url(#badge-shadow)">
    <rect x="120" y="95" width="960" height="225" rx="20" fill="#0B1120" fill-opacity="0.88" stroke="#334155" stroke-width="1.5" />
    <!-- Gradient Top Accent Bar -->
    <path d="M 120 115 A 20 20 0 0 1 140 95 L 1060 95 A 20 20 0 0 1 1080 115 L 1080 119 L 120 119 Z" fill="url(#primary-glow)" />
  </g>

  <!-- Category Tag In Foreground -->
  <g>
    <rect x="460" y="132" width="280" height="28" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
    <text x="600" y="151" text-anchor="middle" fill="#A5B4FC" font-size="12" class="text-code" letter-spacing="0.08em">CURATED TOOLS &amp; ARCHITECTURES</text>
  </g>

  <!-- FOREGROUND HEADLINE -->
  <text x="600" y="208" text-anchor="middle" class="text-title" font-size="38" fill="#FFFFFF">
    Awesome Technical Documentation &amp; Publishing
  </text>

  <!-- Gradient Sub-Accent Line -->
  <rect x="480" y="224" width="240" height="3" rx="1.5" fill="url(#primary-glow)" />

  <!-- FOREGROUND SUBTITLE -->
  <text x="600" y="260" text-anchor="middle" class="text-sub" font-size="17" fill="#94A3B8">
    The Definitive Guide to Docs-as-Code Generators, Enterprise CCMS, and Publishing Pipelines
  </text>
  <text x="600" y="288" text-anchor="middle" class="text-sub" font-size="14.5" fill="#38BDF8">
    Sphinx • Docusaurus • MkDocs • Antora • mdBook • Flare • Paligo • Mintlify • ReadMe
  </text>
</svg>
